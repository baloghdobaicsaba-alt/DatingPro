name: Build Huncutkodjunk Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'huncutkodjunk-android-source-complete-review.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify latest source archive
        run: |
          set -eux
          test -s huncutkodjunk-android-source-complete-review.zip
          unzip -t huncutkodjunk-android-source-complete-review.zip

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/android-cmdline-tools.zip
          mkdir -p /tmp/android-cmdline-tools
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R /tmp/android-cmdline-tools/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Set up Java 8 for legacy Gradle project
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract latest Android source
        run: |
          set -eux
          mkdir -p source
          unzip -q huncutkodjunk-android-source-complete-review.zip -d source
          PROJECT_DIR="$(find source -maxdepth 7 -name gradlew -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          find "$PROJECT_DIR" -maxdepth 2 -type f \( -name 'settings.gradle' -o -name 'build.gradle' -o -name 'gradlew' \) -print

      - name: Build debug APK
        run: |
          set -eux
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          cat > /tmp/legacy-repositories.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  jcenter()
              }
          }
          EOF
          ./gradlew --no-daemon -I /tmp/legacy-repositories.gradle assembleDebug

      - name: Verify APK exists
        run: |
          set -eux
          find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit | grep -q .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huncutkodjunk-debug-apk
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
