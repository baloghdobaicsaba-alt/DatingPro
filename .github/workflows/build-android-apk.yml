name: Build Huncutkodjunk Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'datingapp-huncutkodjunk-android-source-v6.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include Android command-line tools.
      # Avoid setup-android here: its automatic "sdkmanager tools" call fails
      # with current SDK repositories because the legacy "tools" package is gone.
      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Set up Java 8 for legacy Gradle project
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract Android source
        run: |
          test -f datingapp-huncutkodjunk-android-source-v6.zip
          unzip -q datingapp-huncutkodjunk-android-source-v6.zip -d source
          find source -maxdepth 4 -name gradlew -print

      - name: Build debug APK
        run: |
          PROJECT_DIR="$(find source -maxdepth 5 -name gradlew -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huncutkodjunk-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
