name: Build Huncutkodjunk Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'datingapp-huncutkodjunk-android-source-v6.zip'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8 for legacy Gradle project
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
          yes | sdkmanager --licenses

      - name: Extract Android source
        run: |
          test -f datingapp-huncutkodjunk-android-source-v6.zip
          unzip -q datingapp-huncutkodjunk-android-source-v6.zip -d source

      - name: Build debug APK
        working-directory: source/DatingApp-master
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huncutkodjunk-debug-apk
          path: source/DatingApp-master/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
